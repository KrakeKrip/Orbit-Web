name: orbit

services:
  postgres:
    image: postgres:17.11-trixie
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORBIT_DB_USER:?Set ORBIT_DB_USER in .env}
      POSTGRES_PASSWORD: ${ORBIT_DB_PASSWORD:?Set ORBIT_DB_PASSWORD in .env}
      POSTGRES_DB: ${ORBIT_DB_NAME:?Set ORBIT_DB_NAME in .env}
    ports:
      # Публикация только на loopback; снаружи хоста БД недоступна.
      - "127.0.0.1:${ORBIT_DB_PORT:-55432}:5432"
    volumes:
      - orbit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  orbit_pgdata:
